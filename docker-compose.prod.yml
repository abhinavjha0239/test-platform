# ============================================
# Exam Platform - Production Docker Compose
# ============================================
# 
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Copy .env.production.template to .env.production
#   2. Fill in all required environment variables
#   3. Set up SSL certificates (see DEPLOYMENT.md)
#
# Services:
#   - nginx: Reverse proxy with SSL termination
#   - web: Next.js frontend
#   - api: Express API server
#   - grader: Go grading worker (processes exam submissions)
#   - postgres: PostgreSQL database
#   - redis: Redis for job queue and pub/sub

version: '3.8'

services:
  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      - exam-network

  # ============================================
  # Certbot for SSL Certificate Management
  # ============================================
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - exam-network

  # ============================================
  # Next.js Frontend
  # ============================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${FRONTEND_URL}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Express API Server
  # ============================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
      - AZURE_STORAGE_CONTAINER=${AZURE_STORAGE_CONTAINER:-screenshots}
    volumes:
      - api-uploads:/app/uploads
    expose:
      - "3001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Grader (Go)
  # ============================================
  grader:
    build:
      context: .
      dockerfile: apps/grader-go/Dockerfile
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - GRADING_CONCURRENCY=${GRADING_CONCURRENCY:-6}
      - GRADING_STREAM_GROUP=${GRADING_STREAM_GROUP:-grading-workers}
      - GRADING_STREAM_CONSUMER=${GRADING_STREAM_CONSUMER:-}
      - GRADING_STREAM_BLOCK_MS=${GRADING_STREAM_BLOCK_MS:-2000}
      - GRADING_STREAM_BATCH=${GRADING_STREAM_BATCH:-10}
      - GRADING_PEL_IDLE_MS=${GRADING_PEL_IDLE_MS:-60000}
      - GRADING_PEL_POLL_MS=${GRADING_PEL_POLL_MS:-10000}
      - GRADING_RETRY_POLL_MS=${GRADING_RETRY_POLL_MS:-1000}
      - GRADING_RETRY_BASE_MS=${GRADING_RETRY_BASE_MS:-1000}
      - GRADING_RETRY_MAX_MS=${GRADING_RETRY_MAX_MS:-60000}
      - GRADING_MAX_ATTEMPTS=${GRADING_MAX_ATTEMPTS:-3}
      - GRADING_JOB_TTL_SEC=${GRADING_JOB_TTL_SEC:-172800}
    volumes:
      # Mount Docker socket for container-based grading
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - exam-network
    # Grader needs to be in docker group to access socket
    group_add:
      - ${DOCKER_GID:-999}
    # Resource limits for 8-core VM
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 24G
        reservations:
          cpus: '2'
          memory: 4G

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-exam_platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - exam-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Redis (Job Queue & Pub/Sub)
  # ============================================
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# ============================================
# Networks
# ============================================
networks:
  exam-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  certbot-conf:
    driver: local
  certbot-www:
    driver: local
  api-uploads:
    driver: local
