# ============================================
# Exam Platform - Azure Docker Compose
# ============================================
#
# Usage:
#   docker compose -f docker-compose.azure.yml --env-file .env.production up -d
#
# Services:
#   - nginx: Reverse proxy with SSL termination
#   - web: Next.js frontend
#   - api: Express API server (2 replicas for 4-core VM)
#
# External Managed Services (via env vars):
#   - Azure Database for PostgreSQL Flexible Server
#   - Azure Cache for Redis (TLS on port 6380)
#   - Azure Blob Storage (screenshots)

services:
  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      - exam-network

  # ============================================
  # Certbot for SSL Certificate Management
  # ============================================
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - exam-network

  # ============================================
  # Next.js Frontend
  # ============================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${FRONTEND_URL}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Express API Server (4 replicas for 4-core VM)
  # ============================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      # Azure Blob Storage (optional)
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-}
      - AZURE_STORAGE_CONTAINER=${AZURE_STORAGE_CONTAINER:-screenshots}
      # AWS S3 (optional, fallback)
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
    expose:
      - "3001"
    deploy:
      replicas: 4
    restart: unless-stopped
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ============================================
# Networks
# ============================================
networks:
  exam-network:
    driver: bridge

# ============================================
# Volumes
# ============================================
volumes:
  certbot-conf:
    driver: local
  certbot-www:
    driver: local
